<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mitools-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title> MiTools | Calculate Loans, Investments & Tax Easily </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="MiTools offers free financial calculators for South Africa including car loan, bond repayment, and compound interest calculators. Plan your finances and make smarter money decisions."
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://mitools.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MiTools | Free Financial Calculators South Africa" />
    <meta
      property="og:description"
      content="Use MiTools to calculate car loans, home loans, taxes, and investments in South Africa. Free, fast, and easy financial tools."
    />
    <meta property="og:url" content="https://mitools.app/" />
    <meta property="og:image" content="https://mitools.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MiTools | Free Financial Calculators South Africa" />
    <meta
      name="twitter:description"
      content="Free South African financial calculators for car loans, bonds, tax, and investments. Built for smarter money decisions."
    />
    <meta name="twitter:image" content="https://mitools.app/og-image.png" />

    <!--
      Google AdSense and Google Analytics (gtag.js) are intentionally NOT
      loaded here. Both are only injected after the person accepts cookies,
      via src/utils/consentScripts.js, called from CookieBanner.jsx.
      This is what makes the cookie banner's "Decline" option actually mean
      something, instead of just hiding a notice while tracking runs anyway.
    -->

    <!-- Google Search -->
    <meta name="application-name" content="MiTools">
    <meta name="apple-mobile-web-app-title" content="MiTools">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MiTools",
        "alternateName": "MiTools South Africa",
        "url": "https://mitools.app"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MiTechSolutions",
        "url": "https://mitools.app",
        "logo": "https://mitools.app/og-image.png",
        "email": "mitechsolutionsza@gmail.com",
        "description": "MiTechSolutions builds MiTools, a free set of financial calculators and guides for South Africa."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
