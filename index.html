<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mitools-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title> MiTools | Calculate Loans, Investments & Tax Easily </title>

    <!-- Meta description is intentionally NOT set here — each page sets
         its own via react-helmet-async. A static one here would create the
         same duplicate-tag conflict as the canonical/og tags above. -->

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph & Twitter fallbacks — only the values that are genuinely
         identical on every page. og:title, og:description, og:url, and
         twitter:title/description are deliberately NOT set here: each page
         sets its own correct values via react-helmet-async, and having a
         static value here as well created duplicate, conflicting tags that
         Google was using instead of the correct per-page ones (this is what
         caused car-repayment/bond-repayment/compound-interest to be
         classified as "Alternate page with proper canonical tag" pointing
         at the homepage — same root cause, same fix). Twitter's card parser
         falls back to og:title/og:description automatically when its own
         tags are absent, so nothing is lost by omitting them here. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mitools.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mitools.app/og-image.png" />

    <!--
      Google AdSense and Google Analytics (gtag.js) are intentionally NOT
      loaded here. Both are only injected after the person accepts cookies,
      via src/utils/consentScripts.js, called from CookieBanner.jsx.
      This is what makes the cookie banner's "Decline" option actually mean
      something, instead of just hiding a notice while tracking runs anyway.
    -->

    <!-- Google Search -->
    <meta name="application-name" content="MiTools">
    <meta name="apple-mobile-web-app-title" content="MiTools">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MiTools",
        "alternateName": "MiTools South Africa",
        "url": "https://mitools.app"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MiTechSolutions",
        "url": "https://mitools.app",
        "logo": "https://mitools.app/og-image.png",
        "email": "mitechsolutionsza@gmail.com",
        "description": "MiTechSolutions builds MiTools, a free set of financial calculators and guides for South Africa."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
